name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  cancel-tunnel:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel in-progress Tunnel runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -R ${{ github.repository }} --workflow=tunnel.yml --status=in_progress --json databaseId -q '.[].databaseId' | xargs -r -I {} gh run cancel {} -R ${{ github.repository }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # Catches a broken bundle - a bad wrangler.toml rule, or a syntax error
      # that would only surface once Cloudflare tries to build it - without
      # needing an account token. The proxy catalog is fetched at runtime via
      # CATALOG_URL, not bundled, so it plays no part in this check.
      - name: Bundle
        run: npx wrangler deploy --dry-run

  trigger-tunnel:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Tunnel workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run tunnel.yml -R ${{ github.repository }}
