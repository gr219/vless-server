name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  # A broken script would only show up once the tunnel is live, so a failing
  # test keeps the running tunnel in place instead of replacing it.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n scripts/xray-wrapper.sh

  cancel-tunnel:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Cancel in-progress Tunnel runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -R ${{ github.repository }} --workflow=tunnel.yml --status=in_progress --json databaseId -q '.[].databaseId' | xargs -r -I {} gh run cancel {} -R ${{ github.repository }}

  trigger-tunnel:
    needs: cancel-tunnel
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Tunnel workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run tunnel.yml -R ${{ github.repository }}
