name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # Catches a broken bundle - a bad wrangler.toml rule, or a catalog the
      # Text import can no longer resolve - without needing an account token.
      - name: Bundle
        run: npx wrangler deploy --dry-run
