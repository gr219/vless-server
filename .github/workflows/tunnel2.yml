# Runs the 3x-ui panel (MHSanaei/3x-ui, Docker image) on a hosted runner and
# exposes it as https://azr2.std.io.vn/hmm/ through its own named Cloudflare
# Tunnel. It is separate from tunnel.yml's tunnel on purpose: two runners on one
# tunnel would each receive a random share of both hostnames' requests.
#
# The panel's SQLite database (settings, inbounds, clients) runs from xui-live/
# and is carried from run to run through the Actions cache (via xui-db/), so
# changes made in the panel survive the 5-hourly restarts.
#
# Runs hand over without a gap (scripts/handover.py): a new run waits until
# the running one has snapshotted its database, starts from that snapshot,
# and only once its own tunnel connection is up does the old run disconnect.
# For those few seconds both runners serve the tunnel, which is harmless here
# because both serve the same panel, inbounds and page.
#
# Setup, once:
#   1. Cloudflare Zero Trust -> Networks -> Tunnels -> create a second tunnel.
#   2. Add a public hostname azr2.std.io.vn, path hmm, pointing at
#      http://localhost:20530. Xray inbounds created in the panel need their
#      own public hostname/path routes on this tunnel to be reachable.
#   3. Copy the tunnel token into the repo secret CLOUDFLARE_TUNNEL2_TOKEN.
#   4. Panel login in the repo secrets XUI_USERNAME and XUI_PASSWORD. They are
#      applied on every run, so changing the secrets changes the login.
#   5. Optional: the TELEGRAM_* secrets from tunnel.yml, to get the panel URL
#      in Telegram once the tunnel is up.
#   6. Optional: a public hostname azr2.std.io.vn, path ^/qr, pointing at
#      http://localhost:3000 for the VLESS QR page (web/qr/). Keep it above
#      any broader rule: tunnel paths are regexes and the first match wins.
#   7. Optional: likewise path ^/sales, pointing at http://localhost:4000, for
#      the sales page (sales/, built here on every run).

name: Tunnel 2

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'How long to hold the tunnel open (1-350).'
        required: false
        default: '350'
  # A hosted job is capped at 6 h, so a fresh run is started every 5 h and
  # takes over from the one it replaces.
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: read
  actions: write

# No concurrency group: cancel-in-progress would stop the running session
# before its replacement is up. scripts/handover.py coordinates the two runs
# instead, and cancels any run superseded before it took over.

env:
  PUBLIC_HOST: azr2.std.io.vn
  PANEL_PORT: '20530'
  PANEL_BASE_PATH: /hmm/
  XUI_IMAGE: ghcr.io/mhsanaei/3x-ui:latest
  # Cached copy of the database; the panel itself runs on XUI_LIVE_DIR, so a
  # consistent snapshot can be cached while the panel keeps serving.
  XUI_DB_DIR: xui-db
  XUI_LIVE_DIR: xui-live
  QR_WEB_PORT: '3000'
  SALES_WEB_PORT: '4000'

jobs:
  tunnel:
    runs-on: ubuntu-latest
    # The hosted maximum: the 350-minute hold plus the snapshot, the wait for
    # the successor's tunnel, and the cleanup.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets are configured
        env:
          CLOUDFLARE_TUNNEL2_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL2_TOKEN }}
          XUI_USERNAME: ${{ secrets.XUI_USERNAME }}
          XUI_PASSWORD: ${{ secrets.XUI_PASSWORD }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL2_TOKEN" ]; then
            echo "ERR_TUNNEL2_TOKEN_MISSING: set the CLOUDFLARE_TUNNEL2_TOKEN repository secret." >&2
            exit 1
          fi
          if [ -z "$XUI_USERNAME" ] || [ -z "$XUI_PASSWORD" ]; then
            echo "ERR_XUI_LOGIN_MISSING: set the XUI_USERNAME and XUI_PASSWORD repository secrets; the panel would keep its default admin/admin." >&2
            exit 1
          fi

      # Done before waiting on the predecessor, so the hand-over itself is short.
      - name: Pull 3x-ui
        run: docker pull -q "$XUI_IMAGE"

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL -o cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Built before the hand-over so it does not delay it. A broken build only
      # leaves the sales page out; the panel must still come up.
      - name: Build sales page
        id: sales-build
        continue-on-error: true
        working-directory: sales
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build

      - name: Find predecessor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          predecessor=$(python3 "$GITHUB_WORKSPACE/scripts/handover.py" find-predecessor)
          echo "PREDECESSOR_RUN_ID=$predecessor" >> "$GITHUB_ENV"

      # The predecessor's hold loop watches for this step to be running, then
      # snapshots and caches its database while it keeps serving.
      - name: Wait for handover snapshot
        if: env.PREDECESSOR_RUN_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/handover.py" wait-snapshot \
            --run "$PREDECESSOR_RUN_ID" --timeout 240

      # restore-keys picks the newest cache, which after a hand-over is the
      # predecessor's snapshot.
      - name: Restore panel database
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.XUI_DB_DIR }}
          key: tunnel2-xui-db-${{ github.run_id }}
          # tunnel-xui-db- is from when the panel ran inside tunnel.yml.
          restore-keys: |
            tunnel2-xui-db-
            tunnel-xui-db-

      # Applied before the panel starts, since it reads its port and base path
      # only at startup. Listening on 127.0.0.1 keeps the panel reachable only
      # through the tunnel.
      - name: Configure panel
        env:
          XUI_USERNAME: ${{ secrets.XUI_USERNAME }}
          XUI_PASSWORD: ${{ secrets.XUI_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$XUI_DB_DIR" "$XUI_LIVE_DIR"
          if [ -f "$XUI_DB_DIR/x-ui.db" ]; then
            echo "Restored the panel database from the previous run."
            cp -a "$XUI_DB_DIR/." "$XUI_LIVE_DIR/"
          else
            echo "No saved panel database; starting a fresh one."
          fi
          # The image's entrypoint ignores its arguments and starts the panel,
          # so the CLI is called directly.
          docker run --rm --entrypoint /app/x-ui -v "$PWD/$XUI_LIVE_DIR:/etc/x-ui" "$XUI_IMAGE" \
            setting \
              -port "$PANEL_PORT" \
              -webBasePath "$PANEL_BASE_PATH" \
              -listenIP 127.0.0.1 \
              -username "$XUI_USERNAME" \
              -password "$XUI_PASSWORD" > /dev/null

      - name: Start panel
        run: |
          set -euo pipefail
          # Host networking, so inbounds added in the panel listen on the
          # runner's localhost where cloudflared can reach them. Fail2ban must
          # stay enabled: 3x-ui's client IP log job does nothing without it.
          # The IPs it records are the real ones (the inbounds trust
          # CF-Connecting-IP), but an IP-limit ban cannot block anyone, since
          # every connection reaches the runner from cloudflared.
          docker run -d --name 3xui --network host \
            -e XUI_ENABLE_FAIL2BAN=true \
            -v "$PWD/$XUI_LIVE_DIR:/etc/x-ui" \
            "$XUI_IMAGE" > /dev/null

      - name: Wait for panel
        run: |
          set -euo pipefail
          url="http://127.0.0.1:$PANEL_PORT$PANEL_BASE_PATH"
          for _ in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$status" = "200" ]; then
              echo "Panel answers on $url."
              exit 0
            fi
            sleep 2
          done
          echo "ERR_PANEL_START_TIMEOUT: $url did not answer 200 within 120s (last: $status)." >&2
          docker logs --tail 30 3xui >&2 || true
          exit 1

      # Configures inbounds (8443 direct, 8444 WARP), WARP routing, and Telegram bot in 3x-ui
      - name: Configure inbounds and WARP routing
        env:
          XUI_USERNAME: ${{ secrets.XUI_USERNAME }}
          XUI_PASSWORD: ${{ secrets.XUI_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          base="http://127.0.0.1:$PANEL_PORT$PANEL_BASE_PATH"
          python3 "$GITHUB_WORKSPACE/scripts/setup-inbounds.py" \
            --base "$base" \
            --username "$XUI_USERNAME" \
            --password "$XUI_PASSWORD" \
            --host "$PUBLIC_HOST" \
            --tg-token "${TELEGRAM_BOT_TOKEN:-}" \
            --tg-chat-id "${TELEGRAM_CHAT_ID:-}"

      # Static page that rewrites VLESS links copied from the panel and shows
      # them as QR codes. It is served at localhost:3000/; cloudflared does not
      # strip the tunnel's ^/qr path, so the server also strips a /qr prefix.
      # Started before cloudflared: once this runner's connection registers,
      # Cloudflare sends it a share of every route, /qr included. A failure
      # here must not take the panel down.
      - name: Start QR web page
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/qr_web.py" --port "$QR_WEB_PORT" --prefix /qr \
            > qr-web.log 2>&1 < /dev/null &
          echo "QR_WEB_PID=$!" >> "$GITHUB_ENV"
          url="http://127.0.0.1:$QR_WEB_PORT/"
          for _ in $(seq 1 15); do
            if curl -fs -o /dev/null "$url"; then
              echo "QR page answers on $url; public at https://$PUBLIC_HOST/qr/"
              exit 0
            fi
            sleep 1
          done
          echo "ERR_QR_WEB_START_TIMEOUT: $url did not answer within 15s." >&2
          cat qr-web.log >&2 || true
          exit 1

      # The built sales page (sales/dist), served like the QR page by the same
      # static server: at localhost:4000/, also accepting the tunnel's /sales
      # prefix. Before cloudflared for the same reason as the QR page.
      - name: Start sales page
        if: steps.sales-build.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/qr_web.py" --port "$SALES_WEB_PORT" --prefix /sales \
            --directory "$GITHUB_WORKSPACE/sales/dist" > sales-web.log 2>&1 < /dev/null &
          echo "SALES_WEB_PID=$!" >> "$GITHUB_ENV"
          url="http://127.0.0.1:$SALES_WEB_PORT/"
          for _ in $(seq 1 15); do
            if curl -fs -o /dev/null "$url"; then
              echo "Sales page answers on $url; public at https://$PUBLIC_HOST/sales/"
              exit 0
            fi
            sleep 1
          done
          echo "ERR_SALES_WEB_START_TIMEOUT: $url did not answer within 15s." >&2
          cat sales-web.log >&2 || true
          exit 1

      - name: Start cloudflared
        env:
          # cloudflared reads the token from TUNNEL_TOKEN, which keeps the secret
          # out of the process argument list.
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL2_TOKEN }}
        run: |
          set -euo pipefail
          cloudflared tunnel --no-autoupdate --loglevel info run \
            > cloudflared.log 2>&1 < /dev/null &
          echo "CLOUDFLARED_PID=$!" >> "$GITHUB_ENV"

      # The predecessor waits for this step to succeed before it disconnects.
      - name: Wait for tunnel to register
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if grep -q "Registered tunnel connection" cloudflared.log; then
              echo "Tunnel connected; panel at https://$PUBLIC_HOST$PANEL_BASE_PATH"
              exit 0
            fi
            sleep 2
          done
          echo "ERR_TUNNEL_REGISTER_TIMEOUT: no connection registered after 120s." >&2
          cat cloudflared.log >&2
          exit 1

      # A failed send must not take the panel down.
      - name: Send panel URL to Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID are not both set; panel URL not sent."
            exit 0
          fi
          jq -n --arg chat "$TELEGRAM_CHAT_ID" --arg thread "$TELEGRAM_THREAD_ID" \
            --arg panel "https://$PUBLIC_HOST$PANEL_BASE_PATH" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{
            chat_id: $chat,
            parse_mode: "HTML",
            disable_web_page_preview: true,
            text: ("<b>3x-ui panel is up</b>\n" + ($panel | @html) + "\n\n" + ($run | @html))
          } + (if $thread == "" then {} else {message_thread_id: ($thread | tonumber)} end)' > telegram.json
          status=$(curl -s -o telegram-response.json -w '%{http_code}' \
            -H 'Content-Type: application/json' --data @telegram.json \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage")
          rm -f telegram.json
          # continue-on-error shows a failed step as succeeded, so both outcomes
          # leave an annotation on the run.
          if [ "$status" != "200" ]; then
            echo "::error title=Telegram send failed::ERR_TELEGRAM_SEND_FAILED: sendMessage answered $status: $(jq -r '.description // empty' telegram-response.json)"
            exit 1
          fi
          echo "::notice title=Telegram::Panel URL sent to Telegram."

      # A backup of the panel as this run starts serving, to the same chat. The
      # file holds client IDs, the panel login and the WARP keys: keep the chat
      # private. Named <yyyymmddhhmmss in GMT+7>-x-ui.db. Like the message, a
      # failed send must not take the panel down.
      - name: Send panel database to Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID are not both set; panel database not sent."
            exit 0
          fi
          name="$(TZ=Asia/Ho_Chi_Minh date +%Y%m%d%H%M%S)-x-ui.db"
          file="$RUNNER_TEMP/$name"
          trap 'rm -f "$file"' EXIT
          sudo python3 "$GITHUB_WORKSPACE/scripts/db_snapshot.py" "$XUI_LIVE_DIR/x-ui.db" "$file"
          sudo chown "$(id -u):$(id -g)" "$file"
          thread_args=()
          if [ -n "$TELEGRAM_THREAD_ID" ]; then
            thread_args=(-F "message_thread_id=$TELEGRAM_THREAD_ID")
          fi
          status=$(curl -s -o telegram-document.json -w '%{http_code}' \
            -F "chat_id=$TELEGRAM_CHAT_ID" "${thread_args[@]}" \
            -F "caption=3x-ui database, run $GITHUB_RUN_ID" \
            -F "document=@$file;filename=$name" \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument")
          if [ "$status" != "200" ]; then
            echo "::error title=Telegram database send failed::ERR_TELEGRAM_DOCUMENT_FAILED: sendDocument answered $status: $(jq -r '.description // empty' telegram-document.json)"
            exit 1
          fi
          echo "::notice title=Telegram::Panel database sent to Telegram as $name."

      - name: Hold the session open
        env:
          REQUESTED_MINUTES: ${{ github.event.inputs.duration_minutes || '350' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$REQUESTED_MINUTES" in
            '' | *[!0-9]*)
              echo "ERR_DURATION_INVALID: duration_minutes must be a whole number, got '$REQUESTED_MINUTES'." >&2
              exit 1
              ;;
          esac
          if [ "$REQUESTED_MINUTES" -lt 1 ] || [ "$REQUESTED_MINUTES" -gt 350 ]; then
            echo "ERR_DURATION_OUT_OF_RANGE: duration_minutes must be 1-350, got $REQUESTED_MINUTES." >&2
            exit 1
          fi

          # On a manual cancel the runner signals this shell. Stop cloudflared
          # right away; the cleanup steps still snapshot and save the database.
          sleep_pid=''
          on_cancel() {
            echo "Cancelled; stopping cloudflared now."
            kill "$CLOUDFLARED_PID" ${sleep_pid:+"$sleep_pid"} 2>/dev/null || true
            exit 1
          }
          trap on_cancel INT TERM

          deadline=$(( $(date +%s) + REQUESTED_MINUTES * 60 ))
          echo "Holding the tunnel open for ${REQUESTED_MINUTES}m."

          triggered_next=''
          last_report=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            # Sitting on a dead process serves nobody; fail fast so the next
            # scheduled run replaces this one.
            if [ "$(docker inspect -f '{{.State.Running}}' 3xui 2>/dev/null)" != "true" ]; then
              echo "ERR_PROCESS_EXITED: the 3x-ui container stopped." >&2
              exit 1
            fi
            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo "ERR_PROCESS_EXITED: cloudflared (pid $CLOUDFLARED_PID) died." >&2
              exit 1
            fi

            # A newer run waiting for our snapshot: end the hold, keep serving.
            # API errors are only logged; the next tick tries again.
            successor=$(python3 "$GITHUB_WORKSPACE/scripts/handover.py" successor-waiting || true)
            if [ -n "$successor" ]; then
              echo "Run $successor is waiting to take over; handing over."
              echo "SUCCESSOR_RUN_ID=$successor" >> "$GITHUB_ENV"
              exit 0
            fi

            remaining=$(( (deadline - $(date +%s)) / 60 ))
            if [ $(( $(date +%s) - last_report )) -ge 300 ]; then
              echo "[$(date -u +%H:%M:%S)] alive, ${remaining}m remaining"
              last_report=$(date +%s)
            fi

            # Start the replacement 15 minutes before this run expires; it
            # takes over within a few minutes of starting.
            if [ -z "$triggered_next" ] && [ "$remaining" -le 15 ]; then
              if gh workflow run tunnel2.yml -R "$GITHUB_REPOSITORY"; then
                triggered_next=1
                echo "Triggered the replacement Tunnel 2 run."
              else
                echo "::warning::Failed to trigger the replacement Tunnel 2 run; will retry next tick."
              fi
            fi

            # Backgrounded and waited on: bash only runs a trap once the
            # foreground command returns, and `wait` returns at once on a signal.
            sleep 20 &
            sleep_pid=$!
            wait "$sleep_pid" || true
            sleep_pid=''
          done
          echo "Duration reached; shutting down."

      # SQLite's online backup gives a consistent copy while the panel keeps
      # running, so a successor can start from it before this run disconnects.
      - name: Snapshot panel database
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f "$XUI_LIVE_DIR/x-ui.db" ]; then
            echo "No live panel database to snapshot."
            exit 0
          fi
          sudo rm -rf "$XUI_DB_DIR"
          mkdir -p "$XUI_DB_DIR"
          sudo find "$XUI_LIVE_DIR" -maxdepth 1 -type f ! -name 'x-ui.db*' -exec cp -p {} "$XUI_DB_DIR/" \;
          sudo python3 "$GITHUB_WORKSPACE/scripts/db_snapshot.py" "$XUI_LIVE_DIR/x-ui.db" "$XUI_DB_DIR/x-ui.db"
          # The copy is made as root; the cache step runs as the runner user.
          sudo chown -R "$(id -u):$(id -g)" "$XUI_DB_DIR"
          echo "Snapshot of the panel database taken."

      # Skipped when the run failed before a database existed, which would
      # otherwise cache an empty directory over the last good one.
      - name: Save panel database
        if: always() && hashFiles(format('{0}/x-ui.db', env.XUI_DB_DIR)) != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.XUI_DB_DIR }}
          key: tunnel2-xui-db-${{ github.run_id }}

      # Keep serving until the successor's own connection is up. If it fails,
      # stop anyway: the next scheduled run brings the tunnel back.
      - name: Wait for successor to take over
        if: env.SUCCESSOR_RUN_ID != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/handover.py" wait-registered \
            --run "$SUCCESSOR_RUN_ID" --timeout 240

      - name: Stop processes
        if: always()
        run: |
          if [ -n "${CLOUDFLARED_PID:-}" ]; then
            kill "$CLOUDFLARED_PID" 2>/dev/null || true
          fi
          if [ -n "${QR_WEB_PID:-}" ]; then
            kill "$QR_WEB_PID" 2>/dev/null || true
          fi
          if [ -n "${SALES_WEB_PID:-}" ]; then
            kill "$SALES_WEB_PID" 2>/dev/null || true
          fi
          docker stop -t 20 3xui > /dev/null 2>&1 || true

      # Only cloudflared's log: the panel log can name clients, and this repo's
      # artifacts are public.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunnel2-logs-${{ github.run_id }}
          path: cloudflared.log
          if-no-files-found: warn
          retention-days: 3
