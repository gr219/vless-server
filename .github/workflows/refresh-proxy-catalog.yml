name: Refresh proxy catalog

# The upstream lists are rescanned daily, so data/proxies.tsv goes stale on its
# own. This regenerates it, keeps only endpoints that still answer, and opens a
# pull request when anything changed - review the diff, merge, redeploy.
on:
  schedule:
    # 05:30 UTC, a few hours after the upstream daily scan publishes.
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-proxy-catalog
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate the catalog
        run: node scripts/refresh-catalog.mjs

      - name: Verify the worker still parses it
        run: npm test

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/proxies.tsv; then
            echo "catalog unchanged; nothing to do"
            exit 0
          fi

          branch="chore/refresh-proxy-catalog"
          entries=$(grep -cv '^#' data/proxies.tsv)
          today=$(date -u +%Y-%m-%d)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add data/proxies.tsv
          git commit -m "chore: refresh proxy catalog ($today, $entries live entries)"
          git push --force-with-lease origin "$branch"

          # A PR opened with GITHUB_TOKEN does not trigger other workflows, so
          # CI is run above rather than being waited on here.
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --head "$branch" \
              --title "chore: refresh proxy catalog ($today)" \
              --body "Regenerated by \`scripts/refresh-catalog.mjs\` from the upstream NiREvil/vless lists.

          $entries endpoints answered a TCP probe on 443 from the GitHub runner and were kept; anything that did not answer was dropped.

          Merge and redeploy to pick this up - the catalog is bundled into the worker at deploy time."
          else
            echo "existing pull request updated"
          fi
